{% extends "main.html" %}
{% block body %}
    <h1 class="centre">Upload</h1>
    <p class="centre">.glb files only</p>
    <div class="centre" id="3dcanvas"></div>
    <p class = "centre">thumbnail image will be the current screen when you press upload</p>
    <div class = "centre">
        <form method=post enctype=multipart/form-data id="uploadForm">
            <input type="hidden" id="image" name="image"><br>

            <div>
                <label for="name">Name</label>
                <input type="text" id="text" name="name"><br>
            </div>
            
            <div>
                <label for="input" class="file-upload">Upload File</label>
                <input type=file accept=".glb" id="input" name="file"><br><br>
            </div>

            <div>
                <input type="submit">
                <!-- <button onclick="upload()">submit</button> -->
            </div>
        </form>
    </div>
        
    <script type="importmap">
        {
            "imports": {
                "three": "https://esm.sh/three",
                "three/addons/": "https://esm.sh/three/examples/jsm/"
            }
        }
    </script>
    <script src="{{ url_for('static', filename='modelUpload.js') }}" type="module"></script>
{% endblock %}
